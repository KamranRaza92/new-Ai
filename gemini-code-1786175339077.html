<div id="successModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 modal-bg">
    <div class="glass-card max-w-md w-full p-8 rounded-3xl text-center border-blue-500/30 shadow-2xl shadow-blue-500/10">
        <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="check-circle" class="text-emerald-400 w-8 h-8"></i>
        </div>
        <h3 class="text-white text-xl font-bold mb-1">Audit Complete</h3>
        <p class="text-zinc-400 text-xs mb-6">Candidate credentials parsed and scored successfully.</p>
        
        <!-- Dynamic Response Data Container -->
        <div id="modalDataContainer" class="text-left bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 mb-6 space-y-3">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <span class="text-xs text-zinc-400 uppercase font-bold tracking-wider">Candidate Score</span>
                <span id="auditScore" class="text-sm font-bold text-blue-400">--</span>
            </div>
            <div>
                <span class="text-xs text-zinc-400 uppercase font-bold tracking-wider block mb-1">Summary</span>
                <p id="candidateSummary" class="text-xs text-zinc-300 leading-relaxed">--</p>
            </div>
            <div>
                <span class="text-xs text-zinc-400 uppercase font-bold tracking-wider block mb-1">Extracted Skills</span>
                <div id="candidateSkills" class="flex flex-wrap gap-1 mt-1">
                    <!-- Skills badges injected dynamically -->
                </div>
            </div>
        </div>

        <button onclick="closeModal()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95 text-sm">
            Acknowledge & Reset
        </button>
    </div>
</div>
